<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./output.css">
</head>

<body class="bg-[#e3ba9e]">
        <header class=" text-sm border-b sticky z-50 left-0 top-0 bg-[oklch(0.8_0.03_16.45)] py-3">
         <nav class="flex flex-wrap gap-2 p-2 md:px-12 ">
            <div class="flex  items-center font-bold justify-between flex-1">
             <div class="flex items-center font-bold ">
                <span class="bg-rose-600 p-2  rounded-2xl text-amber-50 ">A</span>
                <h1 class=" text-rose-500">AUCHAN</h1>
             </div>
             
             <ul class="flex  gap-1 items-end">
                <li class=" bg-fuchsia-200 rounded-md p-1"><a href="index.html">Botique </a></li>
                <li class=" bg-fuchsia-200 rounded-md p-1"><a href="Admin.html" class=" ">Admin </a></li>
                <li class=" bg-rose-600 rounded-md p-1"><a href="Contacte.html" class=" ">Contacte</a></li>
             </ul>
            </div>
        </nav>
    </header> 
    <main class=" flex justify-center py-20 ">
        <section>
            <section class="p-3">
                <div class="pb-3 ">
                    <p class=" font-bold text-2xl">Contactez-nous</p>
                    <p>Une question ? Notre équipe vous répond sous 24h .</p>
                </div>
                <button id="gene" class="text-amber-50 bg-emerald-500 w-50 h-10 rounded-md">
                <p> 🎲 Générer les données</p>
            </button>
            </section>
            <form action="">
            <section class="grid md:grid-cols-2">
                <div class="p-4">
                    <label for="">prenom*</label>
                    <input id="Cpre" class="bg-amber-50 border w-full h-10 border-amber-950 rounded-md" type="text" placeholder="entre le 1er nom">
                </div>
                <div class="p-4">
                    <label for="">nom*</label>
                    <input id="Cnom" class="bg-amber-50 border w-full h-10 border-amber-950 rounded-md " type="text" placeholder="entre le 2eme nom">
                </div>
                <div class="p-4">
                    <label for="">email*</label>
                    <input id="Cemail" class="bg-amber-50 border w-full h-10 border-amber-950 rounded-md" type="text " placeholder="ex:email@gmail.com">
                </div>
                <div class="p-4">
                    <label for="">Telephone*</label>
                    <input id="Ctele" class="bg-amber-50 border w-full h-10 border-amber-950 rounded-md" type="text" placeholder="ex:0123456789">
                </div>
            </section>
            <div class="p-4">
                <label for="">suge*</label>
                <input id="Csuge" class="bg-amber-50 border w-full h-10 border-amber-950 rounded-md" type="text" placeholder="pour Qua">
            </div>
            <section>
                <div class="p-4">
                    <label for="">mesage*</label>
                    <textarea id="Cmesage" name="" id="" class="bg-amber-50 border w-full min-h-30 border-amber-950 rounded-md " placeholder="entre le mesage"></textarea>
                </div>
                <div class="p-4 ">
                    <button type="submit" class= "bg-amber-50 bg-red-600 w-full h-10 text-amber-50 border-amber-950 rounded-md">
                    Envoyer
                </button>
                </div>
            </section>
            </form>
        </section>
    </main>
    <footer class=" border-t bg-[oklch(0.8_0.03_16.45)] py-3 text-2xl italic text-red-900">
        <div class=" p-5">
            <p class="flex justify-center"> © centre ecommerce Auchan 2026 </p>
        </div>
    </footer>
    <script type="module" src="./js/contacte.js"></script>
</body>
